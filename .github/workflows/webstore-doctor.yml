name: Chrome Web Store Doctor

# Publishing failed for nine months because a wrong publisher id and a missing grant
# both surface as the same opaque 403. This job probes each link of the chain
# separately so the broken one is named. Repository logs are public: every line below
# is a verdict, never an id, token, or account address.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Probe credentials and item access
        env:
          EXTENSION_ID: ${{ secrets.WEBSTORE_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.WEBSTORE_PUBLISHER_ID }}
          WEBSTORE_SERVICE_ACCOUNT_KEY: ${{ secrets.WEBSTORE_SERVICE_ACCOUNT_KEY }}
          # Store listing linked from README.md, so this one is public by definition.
          PUBLIC_EXTENSION_ID: pdpakdgmjhkfimgaihlgaaiijlbilkca
        run: |
          set -uo pipefail

          verdict() { printf '%-38s %s\n' "$1" "$2"; }

          for name in WEBSTORE_EXTENSION_ID:EXTENSION_ID WEBSTORE_PUBLISHER_ID:PUBLISHER_ID \
                      WEBSTORE_SERVICE_ACCOUNT_KEY:WEBSTORE_SERVICE_ACCOUNT_KEY; do
            secret="${name%%:*}"; var="${name##*:}"
            [ -n "${!var:-}" ] && verdict "$secret" "set" || verdict "$secret" "EMPTY"
          done

          if [ "${EXTENSION_ID:-}" = "$PUBLIC_EXTENSION_ID" ]; then
            verdict "extension id vs store listing" "match"
          else
            verdict "extension id vs store listing" "MISMATCH - secret does not address the published item"
          fi

          # A publisher id is a UUID (Publisher > Settings); an extension id is 32
          # lowercase letters. Pasting the extension id here is the common mix-up.
          if [ -z "${PUBLISHER_ID:-}" ]; then
            verdict "publisher id shape" "EMPTY"
          elif printf '%s' "$PUBLISHER_ID" | grep -qiE '^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$'; then
            verdict "publisher id shape" "uuid"
          else
            verdict "publisher id shape" "NOT A UUID - expected the value from Publisher > Settings"
          fi

          token="$(.github/scripts/webstore.sh token 2>/dev/null || true)"
          if [ -z "$token" ]; then
            verdict "service account token" "FAILED to mint"
            exit 1
          fi
          verdict "service account token" "minted"

          info="$(curl -sS "https://www.googleapis.com/oauth2/v3/tokeninfo?access_token=${token}")"
          case "$(printf '%s' "$info" | jq -r '.scope // ""')" in
            *chromewebstore*) verdict "service account scope" "chromewebstore granted" ;;
            *)                verdict "service account scope" "MISSING chromewebstore scope" ;;
          esac

          body="$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer ${token}" \
            "https://chromewebstore.googleapis.com/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:fetchStatus")"
          status="${body##*$'\n'}"
          body="${body%$'\n'*}"
          case "$status" in
            2*) verdict "item access" "OK - can read the item" ;;
            *)  verdict "item access" "HTTP $status $(printf '%s' "$body" | jq -r '.error.status // "?"')" ;;
          esac

          cat <<'NOTE'

          PERMISSION_DENIED means either PUBLISHER_ID does not name the publisher that
          owns this item (Developer Dashboard > Publisher > Settings), or the service
          account was never added under Developer Dashboard > Account. The API answers
          both the same way, so check the Account page first: it is the cheaper of the two.
          NOTE

      - name: Read the item through webstore.sh
        env:
          EXTENSION_ID: ${{ secrets.WEBSTORE_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.WEBSTORE_PUBLISHER_ID }}
          WEBSTORE_SERVICE_ACCOUNT_KEY: ${{ secrets.WEBSTORE_SERVICE_ACCOUNT_KEY }}
        run: |
          # Read-only, so it exercises the exact auth path a release takes without
          # touching the listing. Ids and the public key are dropped as noise.
          .github/scripts/webstore.sh status | jq 'del(.id, .name, .kind, .itemId, .publicKey)'
